name: Publish to Thunderstore

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Package version (example: 2.0.1)'
                required: true
                type: string

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Remove auto-updater
              run: rm -rf ./src/core/updater

            - name: Publish to Thunderstore
              uses: GreenTF/upload-thunderstore-package@v4.3
              with:
                  namespace: SleepyG11
                  description: Quality of Life controls and keybinds for Balatro
                  token: ${{ secrets.THUNDERSTORE_API_KEY }}
                  name: Handy
                  version: ${{ inputs.version }}
                  community: balatro
                  categories: |
                      mods
                      qol
                      libraries
