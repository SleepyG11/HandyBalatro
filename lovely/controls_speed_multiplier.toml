[manifest]
version = "1.0.0"
dump_lua = true
priority = -1

# Allow to use gamespeed in menu when needed
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''self.SPEEDFACTOR = self.SPEEDFACTOR + math.max(0, math.abs(G.ACC) - 2)'''
position = "before"
payload = '''
if Handy.ARGS.use_gamespeed then self.SPEEDFACTOR = self.SETTINGS.GAMESPEED or 1 end
'''
match_indent = true


# Apply multiplier to speed
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''self.SPEEDFACTOR = self.SPEEDFACTOR + math.max(0, math.abs(G.ACC) - 2)'''
position = "after"
payload = '''
self.HANDY_REAL_SPEEDFACTOR = self.SPEEDFACTOR
self.SPEEDFACTOR = self.SPEEDFACTOR * (Handy.speed_multiplier.get_value() or 1)
if Handy.regular_keybinds.cashout_skipped and not Handy.b_is_in_multiplayer() then
    self.SPEEDFACTOR = self.SPEEDFACTOR * 64
end
'''
match_indent = true
